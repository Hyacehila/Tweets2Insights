apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: tweets2insights-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tweets2insights-nginx}
data:
  default.conf: |
    server {
      listen 2026;
      client_max_body_size 50m;
      location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
      location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tweets2insights}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tweets2insights}}
  template:
    metadata: {labels: {app: tweets2insights}}
    spec:
      containers:
        - name: backend
          image: tweets2insights-backend:0.2.0
          envFrom: [{secretRef: {name: tweets2insights-env}}]
          volumeMounts: [{name: data, mountPath: /data}]
          ports: [{containerPort: 8001}]
        - name: worker
          image: tweets2insights-backend:0.2.0
          command: [/app/backend/.venv/bin/python, -m, src.tools.worker]
          envFrom: [{secretRef: {name: tweets2insights-env}}]
          volumeMounts: [{name: data, mountPath: /data}]
        - name: frontend
          image: tweets2insights-frontend:0.2.0
          ports: [{containerPort: 3000}]
        - name: nginx
          image: nginx:1.28-alpine
          ports: [{containerPort: 2026}]
          volumeMounts: [{name: nginx, mountPath: /etc/nginx/conf.d, readOnly: true}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tweets2insights-data}
        - name: nginx
          configMap: {name: tweets2insights-nginx}
---
apiVersion: v1
kind: Service
metadata: {name: tweets2insights}
spec:
  type: ClusterIP
  selector: {app: tweets2insights}
  ports: [{port: 2026, targetPort: 2026}]
