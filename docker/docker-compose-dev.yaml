services:
  backend:
    build: {context: .., dockerfile: docker/backend.Dockerfile}
    command: ["/app/backend/.venv/bin/uvicorn", "src.gateway.app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    env_file: ../.env
    volumes: ["../backend/src:/app/backend/src", "../skills:/app/skills:ro", "research-data:/data"]
  worker:
    build: {context: .., dockerfile: docker/backend.Dockerfile}
    command: ["/app/backend/.venv/bin/python", "-m", "src.tools.worker"]
    env_file: ../.env
    volumes: ["../backend/src:/app/backend/src", "research-data:/data"]
  frontend:
    build: {context: .., dockerfile: docker/frontend.Dockerfile}
    depends_on: [backend]
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:2026:2026"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend, frontend]
volumes:
  research-data:
