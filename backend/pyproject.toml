[project]
name = "tweets2insights-backend"
version = "0.2.0"
description = "LangGraph agent runtime, FastAPI gateway and opinion domain services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2,<3", "pyyaml>=6,<7",
  "python-dotenv>=1,<2", "fastmcp>=2.13,<3", "requests>=2.32,<3",
  "zai-sdk>=0.0.4.2", "numpy>=2.3,<3", "pandas>=2.2,<4",
  "matplotlib>=3.10,<4", "jieba>=0.42", "scikit-learn>=1.5,<2", "psutil>=6,<8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
opinion_core = "src/domain/opinion_core"
opinion_gateway = "src/domain/opinion_gateway"
crawler_worker = "src/domain/crawler_worker"

[tool.setuptools.packages.find]
where = [".", "src/domain"]
include = ["src*", "opinion_core*", "opinion_gateway*", "crawler_worker*"]
exclude = ["src.domain*", "tests*"]

[tool.setuptools.package-data]
opinion_core = ["labeling/vocabularies/*.json"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
